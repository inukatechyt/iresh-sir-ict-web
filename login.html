<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Iresh Sir ICT</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primaryBlue: '#2563EB', darkBg: '#0F172A', cardDark: '#1E293B' }
                }
            }
        }
    </script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-white transition-colors duration-300 min-h-screen flex items-center justify-center p-4">

    <!-- Login/Signup Card -->
    <div class="bg-white dark:bg-cardDark p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100 dark:border-slate-800 relative overflow-hidden">
        
        <!-- Decoration -->
        <div class="absolute top-0 left-0 w-full h-2 bg-primaryBlue"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-primaryBlue mb-2">LMS PORTAL</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm" id="formTitle">කරුණාකර පද්ධතියට පිවිසෙන්න</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold mb-1">විද්‍යුත් තැපෑල (Email)</label>
                <input type="email" id="loginEmail" placeholder="student@example.com" class="w-full p-3 rounded-lg bg-slate-100 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primaryBlue transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">මුරපදය (Password)</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-100 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primaryBlue transition">
            </div>
            <button id="loginBtn" class="w-full bg-primaryBlue hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg mt-4">
                ලොග් වන්න (Log In)
            </button>
            <!-- Google Login Button -->
            <div class="mt-6 border-t border-slate-200 dark:border-slate-700 pt-6">
                  <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-white font-bold py-3.5 px-4 rounded-xl transition shadow-sm">
                   <svg class="w-6 h-6 mr-3" viewBox="0 0 48 48">
                         <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                           <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    </svg>
                        Continue with Google
                    </button>
            </div>
            <p class="text-center text-sm text-slate-500 mt-4">
                ගිණුමක් නැද්ද? <button onclick="toggleForms()" class="text-primaryBlue hover:underline font-bold">ලියාපදිංචි වන්න</button>
            </p>

        </div>

        <!-- Sign Up Form (මුලින් සඟවා ඇත) -->
        <div id="signupForm" class="space-y-5 hidden">
            <div>
                <label class="block text-sm font-semibold mb-1">ඔබේ නම (Name)</label>
                <input type="text" id="signupName" placeholder="උදා: Inuka Sanjula" class="w-full p-3 rounded-lg bg-slate-100 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primaryBlue transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">විද්‍යුත් තැපෑල (Email)</label>
                <input type="email" id="signupEmail" placeholder="student@example.com" class="w-full p-3 rounded-lg bg-slate-100 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primaryBlue transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">මුරපදය (Password)</label>
                <input type="password" id="signupPassword" placeholder="අවම වශයෙන් අකුරු 6ක්" class="w-full p-3 rounded-lg bg-slate-100 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-primaryBlue transition">
            </div>
            <button id="signupBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition shadow-lg mt-4">
                ගිණුම සාදන්න (Sign Up)
            </button>
            <p class="text-center text-sm text-slate-500 mt-4">
                දැනටමත් ගිණුමක් තිබේද? <button onclick="toggleForms()" class="text-primaryBlue hover:underline font-bold">ලොග් වන්න</button>
            </p>
        </div>

        <!-- Error/Success Message පෙන්වන තැන -->
        <p id="authMessage" class="text-center text-sm mt-4 hidden font-semibold"></p>

    </div>

    <!-- UI එකේ Forms මාරු කරන JS කෝඩ් එක -->
    <script>
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const formTitle = document.getElementById('formTitle');
            const authMessage = document.getElementById('authMessage');

            authMessage.classList.add('hidden'); // පරණ මැසේජ් මකනවා

            if (loginForm.classList.contains('hidden')) {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                formTitle.innerText = "කරුණාකර පද්ධතියට පිවිසෙන්න";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                formTitle.innerText = "නව ගිණුමක් සාදන්න";
            }
        }
    </script>
    
    <!-- Backend එකට සම්බන්ධ කරන JS ෆයිල් එක -->
    <script src="login.js"></script>
</body>
</html>
